{% extends 'base.html' %}
{% block title %}Error {{ code }} — The Daily Write{% endblock %}
{% block content %}
<div class="container page-body" style="text-align:center;padding-top:6rem;">
    <p style="font-family:'DM Mono',monospace;font-size:5rem;font-weight:400;color:var(--rule);line-height:1;">{{ code }}</p>
    <h1 style="margin-bottom:1rem;">{{ message }}</h1>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
