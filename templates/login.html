<div class="container page-body">
    <div class="login-wrap">
        <div class="login-card">
            <h1>Sign In</h1>
            <p class="login-subhead">Access your blog dashboard</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                           placeholder="e.g. admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.7rem;">
                    Log In
                </button>
            </form>

            <p style="margin-top:1.5rem;font-size:0.78rem;color:var(--muted);font-family:'DM Mono',monospace;">
                Demo accounts: <strong>admin</strong> / password &nbsp;·&nbsp; <strong>jane</strong> / password
            </p>
        </div>
    </div>
</div>
{% endblock %}
